<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>这周吃什么</title>
<style>
  :root {
    --bg: #f7f8f5;
    --card: #ffffff;
    --ink: #26302b;
    --ink-soft: #6b7a72;
    --line: #e4e9e3;
    --line-soft: #eef2ed;
    --green: #3e7d64;       /* 青瓷绿:主行动色 */
    --green-soft: #e7f1ec;
    --baby: #c4652a;        /* 暖杏:宝宝专属色,全站唯一强调 */
    --baby-soft: #fdf0e5;
    --baby-ink: #7a4318;
    --warn: #a8712a;
    --warn-soft: #fbf1df;
    --spice: #b3452e;
    --on-green: #ffffff;   /* 绿底上的文字 */
    --radius: 14px;
  }
  /* 深色令牌只写一份:跟随系统(除非被显式指定浅色),或被显式指定深色 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141816; --card: #1d2321; --ink: #e6ece8; --ink-soft: #93a29a;
      --line: #2b3330; --line-soft: #232a27;
      --green: #6fb597; --green-soft: #1f302a;
      --baby: #e08b4d; --baby-soft: #33241a; --baby-ink: #f0c39a;
      --warn: #d6a259; --warn-soft: #322718;
      --spice: #e0755c; --on-green: #10201a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141816; --card: #1d2321; --ink: #e6ece8; --ink-soft: #93a29a;
    --line: #2b3330; --line-soft: #232a27;
    --green: #6fb597; --green-soft: #1f302a;
    --baby: #e08b4d; --baby-soft: #33241a; --baby-ink: #f0c39a;
    --warn: #d6a259; --warn-soft: #322718;
    --spice: #e0755c; --on-green: #10201a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink);
    font-size: 16px; line-height: 1.55;
    padding-bottom: calc(66px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  header {
    padding: 18px 18px 10px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  }
  header h1 { font-size: 22px; font-weight: 700; letter-spacing: .5px; }
  header .week { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; text-align: right; }

  .menu-top { display: flex; gap: 8px; margin: 4px 14px 12px; }
  /* 重排后的撤销条:先做后给退路,不拦二次确认 */
  .undo-bar {
    margin: 0 14px 10px; padding: 8px 12px; border-radius: 10px; background: var(--line-soft);
    color: var(--ink-soft); font-size: 12.5px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .undo-bar button {
    border: 1px solid var(--line); background: var(--card); color: var(--green);
    font-family: inherit; font-size: 12.5px; padding: 4px 12px; border-radius: 8px;
    cursor: pointer; flex-shrink: 0; font-weight: 700;
  }
  .gen-btn {
    display: block; margin: 0; flex: 1; width: auto;
    padding: 13px; border: none; border-radius: var(--radius);
    background: var(--green); color: var(--on-green); font-size: 16px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .gen-btn:active { opacity: .85; }

  /* ---------- 本周体检 ---------- */
  .health { margin: 0 14px 12px; display: flex; gap: 7px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 11px 5px 8px; font-size: 12.5px;
    color: var(--ink-soft); white-space: nowrap;
  }
  .chip b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 700; }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  .chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
  .chip.warn b { color: var(--warn); }
  .chip.warn .dot { background: var(--warn); }
  .chip.baby { background: var(--baby-soft); border-color: transparent; color: var(--baby-ink); }
  .chip.baby b { color: var(--baby-ink); }
  .chip.baby .dot { background: var(--baby); }

  /* ---------- 周概览 ---------- */
  .ov-toggle {
    margin: 0 14px 10px; display: flex; gap: 6px;
    background: var(--line-soft); border-radius: 10px; padding: 3px;
  }
  .ov-toggle button {
    flex: 1; border: none; background: none; font-family: inherit;
    font-size: 13px; padding: 7px 0; border-radius: 8px; cursor: pointer; color: var(--ink-soft);
  }
  .ov-toggle button.on { background: var(--card); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.06); }

  .grid { margin: 0 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .grid-row { display: grid; grid-template-columns: 42px 1fr 1fr 1fr; border-bottom: 1px solid var(--line-soft); }
  .grid-row:last-child { border-bottom: none; }
  .grid-row.head { background: var(--line-soft); }
  .grid-row.head div { font-size: 11px; color: var(--ink-soft); font-weight: 700; letter-spacing: 1px; padding: 7px 6px; text-align: center; }
  .grid-row.today { background: var(--green-soft); }
  .grid-day { font-size: 12px; font-weight: 700; color: var(--green); display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--line-soft); }
  .grid-cell { padding: 7px 8px; border-right: 1px solid var(--line-soft); min-width: 0; }
  .grid-cell:last-child { border-right: none; }
  .grid-cell span { display: block; font-size: 12.5px; line-height: 1.45; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grid-cell span.sub { color: var(--ink-soft); font-size: 11.5px; }
  .grid-cell span.nob { color: var(--ink-soft); opacity: .55; }
  .bdot {
    display: inline-flex; align-items: center; justify-content: center;
    width: 15px; height: 15px; border-radius: 50%; margin-right: 4px;
    background: var(--baby); color: #fff; font-size: 9.5px; font-style: normal;
    font-weight: 700; vertical-align: 1px; flex-shrink: 0;
  }

  /* ---------- 日详情 ---------- */
  .day { margin: 0 14px 18px; }
  .day-label {
    font-size: 13px; font-weight: 700; color: var(--ink-soft);
    padding: 0 6px 6px; letter-spacing: 1px;
    display: flex; align-items: baseline; gap: 8px;
  }
  .day-label em { font-style: normal; color: var(--green); font-size: 15px; }
  .day-label .today-flag { background: var(--green); color: var(--on-green); font-size: 10px; padding: 1px 7px; border-radius: 999px; letter-spacing: 0; }

  .meal {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 11px 14px 12px; margin-bottom: 8px;
  }
  .meal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .meal-name { font-size: 12px; color: var(--ink-soft); font-weight: 700; letter-spacing: 2px; }
  .meal-time { font-size: 11.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .meal-time.over { color: var(--warn); font-weight: 700; }
  .dish { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; }
  .dish-name { font-size: 16px; }
  .dish-meta { font-size: 12px; color: var(--ink-soft); margin-left: 6px; font-variant-numeric: tabular-nums; }
  .spicy { color: var(--spice); font-size: 12px; margin-left: 4px; }
  .swap {
    border: 1px solid var(--line); background: none; border-radius: 8px; font-family: inherit;
    font-size: 12px; color: var(--green); padding: 3px 9px; cursor: pointer; flex-shrink: 0;
  }
  .swap:active { background: var(--green-soft); }
  /* 签名元素:宝宝行 */
  .baby-row {
    margin: 6px 0 2px; padding: 8px 10px;
    background: var(--baby-soft); border-radius: 10px;
    font-size: 13px; color: var(--baby-ink); display: flex; gap: 8px; line-height: 1.5;
  }
  .baby-row::before { content: "宝"; flex-shrink: 0; width: 20px; height: 20px;
    background: var(--baby); color: #fff; border-radius: 50%;
    font-size: 11px; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  .baby-row.na { background: var(--line-soft); color: var(--ink-soft); }
  .baby-row.na::before { background: #a9aca6; content: "无"; }

  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 20px;
    background: var(--green-soft); color: var(--green); margin-left: 6px; vertical-align: 1px; }
  .tag.noodle { background: var(--warn-soft); color: var(--warn); }
  /* 当季专属:过了这几个月就吃不到,排菜时优先级最高,页面上也标出来 */
  .tag.season { background: transparent; border: 1px solid var(--green); color: var(--green); }
  /* 宝宝能不能吃:菜名旁边直接说,不用去读下面那条 */
  .tag.baby-tag { background: var(--baby); color: #fff; font-weight: 700; }
  .tag.baby-no { background: var(--line-soft); color: var(--ink-soft); }

  /* ---------- 购物清单 ---------- */
  .batch { margin: 0 14px 20px; }
  .batch-head { font-size: 15px; font-weight: 700; padding: 0 6px 4px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .batch-head .prog { font-size: 12px; font-weight: 400; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .bar { height: 4px; background: var(--line-soft); border-radius: 99px; margin: 0 6px 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--green); border-radius: 99px; transition: width .2s; }
  .cat-block { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 8px; padding: 8px 14px; }
  .cat-title { font-size: 12px; color: var(--ink-soft); font-weight: 700; letter-spacing: 2px; margin-bottom: 2px; }
  .shop-item { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); cursor: pointer; }
  .shop-item:last-child { border-bottom: none; }
  .shop-item .box {
    width: 19px; height: 19px; border: 1.5px solid var(--line); border-radius: 6px;
    flex-shrink: 0; margin-top: 3px; display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: #fff;
  }
  .shop-item.done .box { background: var(--green); border-color: var(--green); }
  .shop-item.done .s-name, .shop-item.done .shop-qty { text-decoration: line-through; opacity: .45; }
  .shop-item .grow { flex: 1; min-width: 0; }
  .s-name { font-size: 15px; }
  .shop-qty { font-variant-numeric: tabular-nums; color: var(--ink-soft); flex-shrink: 0; margin-top: 1px; }
  .storage-tip { font-size: 12px; color: var(--baby); margin-top: 1px; }
  .storage-tip.plain { color: var(--ink-soft); }
  .badge-today { font-size: 10.5px; padding: 1px 7px; border-radius: 999px; margin-left: 6px;
    background: var(--spice); color: #fff; vertical-align: 1px; white-space: nowrap; }
  .bf-item { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 5px 0; font-size: 14.5px; }
  .bf-item + .bf-item { border-top: 1px dashed var(--line); }
  .bf-item .times { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; flex-shrink: 0; }

  /* ---------- 时令指南 ---------- */
  .season-page { margin: 0 14px; }
  .month-strip { display: grid; grid-template-columns: repeat(12, 1fr) 1.6fr; gap: 3px; margin-bottom: 12px; }
  .month-strip button.all { font-size: 11px; letter-spacing: -.5px; }
  .month-strip button {
    border: 1px solid var(--line); background: var(--card); font-family: inherit;
    font-size: 12px; padding: 8px 0; border-radius: 8px; cursor: pointer; color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .month-strip button.on { background: var(--green); border-color: var(--green); color: var(--on-green); font-weight: 700; }
  .month-strip button.now { border-color: var(--green); color: var(--green); font-weight: 700; }
  .month-strip button.on.now { color: var(--on-green); }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .filters button {
    border: 1px solid var(--line); background: var(--card); font-family: inherit;
    font-size: 12.5px; padding: 5px 11px; border-radius: 999px; cursor: pointer; color: var(--ink-soft);
  }
  .filters button.on { background: var(--green-soft); border-color: transparent; color: var(--green); font-weight: 700; }

  .ing-block { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; padding: 10px 14px 12px; }
  .ing-row { display: grid; grid-template-columns: 1fr 132px; align-items: center; gap: 10px; padding: 6px 0; }
  .ing-keep { font-size: 11.5px; color: var(--ink-soft); line-height: 1.45; margin-top: 1px; }
  .ing-keep.urgent { color: var(--baby); }
  .cat-bar { margin-top: -4px; }
  .cat-bar button { font-size: 12px; padding: 4px 10px; }
  .ing-row + .ing-row { border-top: 1px dashed var(--line); }
  .ing-name { font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ing-name .nb { font-size: 11px; color: var(--ink-soft); margin-left: 5px; }
  .bars { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; }
  .bars i { height: 14px; border-radius: 2px; background: var(--line-soft); display: block; }
  .bars i.on { background: var(--green); opacity: .38; }
  .bars i.sel { outline: 1.5px solid var(--green); outline-offset: 1px; }
  .bars i.on.sel { opacity: 1; }
  .legend { font-size: 11px; color: var(--ink-soft); padding: 2px 2px 10px; line-height: 1.7; }

  .rec-row { padding: 2px 0; }
  .rec-row + .rec-row { border-top: 1px dashed var(--line); }
  .rec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 0; cursor: pointer; }
  .rec-row .meta { font-size: 11.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .rec-row .caret { font-style: normal; font-size: 9px; margin-left: 6px; color: var(--ink-soft); }
  .rec-row.open { background: var(--line-soft); border-radius: 10px; margin: 4px -6px; padding: 2px 6px 8px; }
  .rec-detail { padding-top: 2px; }
  .rec-line { display: flex; gap: 8px; font-size: 13px; line-height: 1.6; padding: 3px 0; flex-wrap: wrap; }
  .rec-line em { font-style: normal; color: var(--ink-soft); font-size: 11.5px; flex-shrink: 0;
    width: 34px; letter-spacing: 1px; padding-top: 2px; }
  .rec-line.plain { color: var(--ink-soft); }
  .ing-chips { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; }
  .ing-chip { background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 9px; font-size: 12.5px; }
  .ing-chip b { font-variant-numeric: tabular-nums; color: var(--green); }
  .rec-tag { font-size: 11px; background: var(--card); border: 1px solid var(--line);
    color: var(--ink-soft); border-radius: 999px; padding: 1px 8px; margin-right: 5px; }
  .rec-tag.season-tag { font-variant-numeric: tabular-nums; }
  .rec-row .baby-row { margin: 6px 0 2px; }
  .rec-cat { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--line-soft); color: var(--ink-soft); margin-right: 6px; }

  /* ---------- 宝宝页 ---------- */
  .baby-page { margin: 0 14px; }
  .sched { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 14px; margin-bottom: 14px; }
  .sched-row { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
  .sched-row:last-child { border-bottom: none; }
  .sched-time { font-variant-numeric: tabular-nums; color: var(--baby); font-weight: 600; flex-shrink: 0; width: 92px; }
  .rule-block { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; }
  .rule-block h3 { font-size: 14px; margin-bottom: 6px; color: var(--baby); }
  .rule-block li { margin-left: 18px; font-size: 14px; padding: 2px 0; }
  .rule-block p { font-size: 14px; padding: 2px 0; }
  .rule-block b { color: var(--ink); }
  .wk-list { display: flex; flex-direction: column; gap: 6px; }
  .wk-item { display: flex; align-items: center; gap: 9px; font-size: 13.5px; }
  .wk-item .pill { font-size: 11px; font-variant-numeric: tabular-nums; padding: 1px 8px; border-radius: 999px; background: var(--green-soft); color: var(--green); flex-shrink: 0; }
  .wk-item .pill.warn { background: var(--warn-soft); color: var(--warn); }

  /* ---------- 底部导航 ---------- */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 5;
    display: flex; background: var(--card); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav .inner { display: flex; width: 100%; max-width: 720px; margin: 0 auto; }
  nav button {
    flex: 1; padding: 12px 0 10px; border: none; background: none; font-family: inherit;
    font-size: 14px; color: var(--ink-soft); cursor: pointer;
  }
  nav button.on { color: var(--green); font-weight: 700; }
  /* ---------- 今天卡片 / 提示条 ---------- */
  .today-card {
    margin: 0 14px 12px; background: var(--card); border: 1px solid var(--green);
    border-radius: var(--radius); padding: 12px 14px 10px;
  }
  .today-head { font-size: 12px; font-weight: 700; color: var(--green); letter-spacing: 2px; margin-bottom: 6px; }
  .today-meal + .today-meal { border-top: 1px dashed var(--line); margin-top: 8px; padding-top: 8px; }
  .today-label { font-size: 11.5px; color: var(--ink-soft); letter-spacing: 1px;
    display: flex; justify-content: space-between; }
  .today-mins { font-variant-numeric: tabular-nums; }
  .today-dishes { font-size: 16px; line-height: 1.5; margin-top: 2px; }
  .today-dishes .sep { color: var(--ink-soft); margin: 0 6px; }
  .today-warn { font-size: 12px; color: var(--baby); margin-top: 3px; }
  .stale { margin: 0 14px 10px; padding: 9px 12px; border-radius: 10px;
    background: var(--warn-soft); color: var(--warn); font-size: 13px; }

  /* 宝宝标记:只标例外。能吃的给一个小钮,想看分菜时机才展开 */
  .baby-mini {
    border: 1px solid var(--baby); background: none; color: var(--baby);
    font-family: inherit; font-size: 10.5px; padding: 0 6px; border-radius: 999px;
    margin-left: 6px; cursor: pointer; vertical-align: 1px; line-height: 17px;
  }
  .baby-mini.on { background: var(--baby); color: #fff; }
  .bdot.no { background: #a9aca6; }
  .swap-wrap { display: flex; gap: 6px; flex-shrink: 0; }
  .swap.undo { color: var(--warn); border-color: var(--warn); }
  .swap[disabled] { opacity: .35; cursor: default; }
  .shop-qty .pack { display: block; font-style: normal; font-size: 11px; color: var(--ink-soft); text-align: right; }
  .copy-btn { margin-left: auto; }

  /* ---------- 搜索 ---------- */
  .search-box { display: flex; gap: 6px; margin-bottom: 10px; }
  .search-box input {
    flex: 1; font-family: inherit; font-size: 14px; padding: 8px 12px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink);
  }
  .search-box button {
    border: 1px solid var(--line); background: var(--card); color: var(--ink-soft);
    font-family: inherit; font-size: 12.5px; padding: 0 12px; border-radius: 10px; cursor: pointer;
  }
  .miss-hint { background: var(--warn-soft); color: var(--warn); font-size: 13px;
    padding: 9px 12px; border-radius: 10px; margin-bottom: 10px; }
  .miss-hint button { border: none; background: var(--warn); color: #fff; font-family: inherit;
    font-size: 12px; padding: 3px 10px; border-radius: 8px; margin-left: 6px; cursor: pointer; }

  /* ---------- 今晚吃什么 ---------- */
  .draw-page { margin: 0 14px; }
  .draw-intro { font-size: 12.5px; color: var(--ink-soft); line-height: 1.7; margin-bottom: 12px; }
  .slots { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .slot { display: flex; align-items: center; gap: 6px; }
  .slot-label { font-size: 11.5px; color: var(--ink-soft); width: 34px; letter-spacing: 1px; flex-shrink: 0; }
  .slot button {
    border: 1px solid var(--line); background: var(--card); color: var(--ink-soft);
    font-family: inherit; font-size: 12.5px; padding: 5px 12px; border-radius: 999px; cursor: pointer;
  }
  .slot button.on { background: var(--green-soft); border-color: transparent; color: var(--green); font-weight: 700; }
  .draw-btn { margin: 0 0 14px; width: 100%; }
  .draw-btn[disabled] { opacity: .45; cursor: default; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 9px 8px; display: flex; flex-direction: column; justify-content: space-between; min-height: 190px;
  }
  .card.flipped { background: var(--baby-soft); border-color: transparent; }
  .card-name { font-size: 15px; font-weight: 700; line-height: 1.35; }
  .card-meta { font-size: 11.5px; color: var(--ink-soft); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .card-tags { margin-top: 5px; }
  .card-tags .tag { margin-left: 0; margin-right: 4px; }
  .card-ings { font-size: 11.5px; color: var(--ink-soft); margin-top: 7px; line-height: 1.6; }
  .card-back-t { font-size: 11px; color: var(--baby-ink); font-weight: 700; letter-spacing: 1px; margin-bottom: 4px; }
  .card-back p { font-size: 12px; color: var(--baby-ink); line-height: 1.55; }
  .card-back p.mod { margin-top: 4px; opacity: .85; }
  .card-back p.na { color: var(--ink-soft); }
  .card-actions { display: flex; flex-direction: column; gap: 5px; margin-top: 9px; }
  .card-actions button { font-family: inherit; font-size: 12px; padding: 6px 0; border-radius: 8px; cursor: pointer; }
  .card-actions .flip { border: 1px solid var(--line); background: none; color: var(--ink-soft); }
  .card-actions .take { border: none; background: var(--green); color: var(--on-green); font-weight: 700; }
  @media (max-width: 380px) {
    .cards { grid-template-columns: 1fr; }
    .card { min-height: 0; }
  }

  .empty { text-align: center; color: var(--ink-soft); padding: 60px 30px; font-size: 15px; line-height: 1.8; }
  .footnote { text-align: center; font-size: 11px; color: var(--ink-soft); padding: 8px 18px 4px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="page-title">这周吃什么</h1><div class="week" id="week-label"></div></header>
  <main id="app"></main>
</div>
<nav><div class="inner">
  <button data-view="menu" class="on">菜单</button>
  <button data-view="draw">今晚</button>
  <button data-view="shop">买菜</button>
  <button data-view="season">时令</button>
  <button data-view="baby">宝宝</button>
</div></nav>

<script>
const DATA = /*__DATA__*/null;
const { config, babyRules, ingredients, recipes } = DATA;
const ING = Object.fromEntries(ingredients.items.map(i => [i.name, i]));
const DAYS = ['周一','周二','周三','周四','周五','周六','周日'];
const MEALS = [['breakfast','早餐'],['lunch','午餐'],['dinner','晚餐']];
const store = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem('fm_' + k)) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem('fm_' + k, JSON.stringify(v)); } catch {} }
};
// localStorage 里可能存着旧版本或残缺的菜单(这个页面的数据结构改过几次)。
// 形状不对就当没有——否则渲染时 days[i].lunch 取不到,整页白屏,用户还无从下手。
const validWeek = (w) => !!w && Array.isArray(w.days) && w.days.length === DAYS.length
  && w.days.every(d => d && d.breakfast && d.lunch && d.dinner);
const loadWeek = (k) => { const w = store.get(k, null); return validWeek(w) ? w : null; };

let week = loadWeek('week');
let bought = store.get('bought', {});
let prevWeek = loadWeek('prevWeek');           // 重排前的上一周,撤销用
let prevBought = store.get('prevBought', null);
let shopFilter = store.get('shopFilter', null);
let seasonCat = store.get('seasonCat', null);
let openRec = null;                            // 时令页展开的菜谱 id
let openBaby = store.get('openBaby', {});      // 详细页展开了宝宝行的菜位
let lastSwap = null;                           // 最近一次「换一换」,用于撤销
let seasonQ = '';                              // 时令页搜索词
let copied = false;                            // 「复制清单」的短暂反馈
let draw = store.get('draw', null);            // 今晚吃什么:当前三个候选
let drawSlots = store.get('drawSlots', {});    // 今晚吃什么:条件槽
let view = 'menu';
let overview = store.get('overview', true);
let seasonMonth = store.get('seasonMonth', new Date().getMonth() + 1);
let seasonFilter = store.get('seasonFilter', null);
let seasonTab = store.get('seasonTab', 'ing');

// ---------- 工具 ----------
const month = new Date().getMonth() + 1;
const todayIdx = (new Date().getDay() + 6) % 7;   // 周一=0
const inSeason = (m) => m === 'all' || (Array.isArray(m) && m.includes(month));
const recipeInSeason = (r) => inSeason(r.season_months);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const shuffle = (arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const R = (id) => recipes.items.find(r => r.id === id);
// 鱼 = 水产类里的鱼(虾另计),用于每周鱼次数核对
const FISH = ingredients.items.filter(i => i.category === '水产' && i.name !== '虾').map(i => i.name);
// 不隔夜的鲜货:只能排在采购当天
const SAME_DAY = ingredients.items.filter(i => i.same_day).map(i => i.name);
const BUY_DAYS = Object.keys(config.shopping.batch_coverage).map(d => DAYS.indexOf(d)).filter(i => i >= 0);
// 天 -> 采购批次序号(读 batch_coverage,不写死);评分时用来算「同批次内的食材复用」
const DAY_BATCH = (() => {
  const cov = config.shopping.batch_coverage, map = {};
  Object.keys(cov).forEach((k, bi) => cov[k].forEach(d => {
    const i = DAYS.indexOf(d); if (i >= 0) map[i] = bi;
  }));
  return map;
})();
const batchOf = (dayIdx) => DAY_BATCH[dayIdx] ?? 0;
// 每周营养区间:从 baby_rules 的文案里解析「2-3 次」「1-2 次」这类写法
function range(text, dMin, dMax) {
  const r = String(text).match(/(\d+)\s*[-–~]\s*(\d+)/);
  if (r) return { min: +r[1], max: +r[2] };
  const n = String(text).match(/\d+/);
  return n ? { min: +n[0], max: dMax } : { min: dMin, max: dMax };
}
const FISH_T  = range(babyRules.nutrition_weekly.fish, 2, 3);
const LIVER_T = range(babyRules.nutrition_weekly.liver, 1, 2);

function pool(cats, mealType) {
  return recipes.items.filter(r =>
    cats.includes(r.category) && r.meal_type.includes(mealType) && recipeInSeason(r));
}

// ---------- 排菜 ----------
function generateWeek() {
  const used = {};          // recipeId -> 已排天序(冷却)
  const mainCount = {};     // 主料 -> 次数/周
  const batchIng = {};      // 采购批次 -> {主料: 次数},算食材复用分
  const dayIng = {};        // 天 -> {主料: 次数},同一天撞主料要罚
  let noodle = 0, fish = 0, liver = 0, daysDone = 0;
  const soupDays = new Set();
  while (soupDays.size < Math.min(config.constraints.soup_per_week_max, 2)) {
    soupDays.add(Math.floor(Math.random() * DAYS.length));
  }

  // 面食夜:从**非采购日**里随机挑。面食夜没有荤位,压在采购日上就等于浪费了当天
  // 唯一能吃不隔夜鱼虾的机会(周六当采购日时鲜货只能上 77%,就是这么来的);
  // 而固定挑周二/周四/周六会让每周的面食夜一模一样。非采购日不够就退回全周挑。
  const noodleMax = config.constraints.noodle_per_week_max;
  const offDays = DAYS.map((_, i) => i).filter(i => !BUY_DAYS.includes(i));
  const noodleDays = new Set(
    shuffle(offDays.length >= noodleMax ? offDays : DAYS.map((_, i) => i)).slice(0, noodleMax));

  // 硬约束:放宽候选池时也不能突破
  const okHere = (r, dayIdx) => {
    if (hasIng(r, SAME_DAY) && !BUY_DAYS.includes(dayIdx)) return false;   // 不隔夜的鲜货只排采购当天
    if (hasIng(r, FISH) && fish >= FISH_T.max) return false;              // 鱼每周上限
    if (hasIng(r, ['猪肝']) && liver >= LIVER_T.max) return false;         // 猪肝每周上限
    return true;
  };
  const take = (r, dayIdx, budget) => {
    used[r.id] = dayIdx;
    r.main_ingredients.forEach(m => {
      mainCount[m.name] = (mainCount[m.name] || 0) + 1;
      const b = batchOf(dayIdx);
      (batchIng[b] = batchIng[b] || {})[m.name] = (batchIng[b][m.name] || 0) + 1;
      dayIng[dayIdx] = dayIng[dayIdx] || {};
      dayIng[dayIdx][m.name] = (dayIng[dayIdx][m.name] || 0) + 1;
    });
    if (hasIng(r, FISH)) fish++;
    if (hasIng(r, ['猪肝'])) liver++;
    if (budget) budget.mins += r.cook_time_min;
    return r.id;
  };

  // 评分函数:时令分 + 营养缺口填补 + 耗时匹配 + 食材复用 − 重复惩罚。
  // 硬约束已经在 okHere 挡过一轮,这里只在合法候选里排序。
  const score = (r, dayIdx, budget) => {
    let s = 0;
    // 时令分:限定月份的菜过了季就吃不到,优先于全年都有的菜
    if (r.season_months !== 'all') s += 3;
    // 营养缺口填补:按「还剩几天 vs 还差几次」取二次曲线,周初几乎不加分,越拖越急。
    // 这里必须是二次而不是线性:线性在周一也有 +1.4,足以让唯一能在非采购日上的
    // 冷冻龙利鱼稳赢,结果每周一必是龙利鱼。周初不加压,鲜鱼才等得到周三/周日。
    // 「还剩几天」按已填的天数算,不能按 dayIdx——填充顺序是打乱的
    const urgency = (have, need) => {
      const miss = need - have;
      if (miss <= 0) return 0;
      return Math.min(1, miss / Math.max(1, DAYS.length - daysDone)) ** 2;
    };
    if (hasIng(r, FISH)) s += 5 * urgency(fish, FISH_T.min);
    if (hasIng(r, ['猪肝'])) s += 5 * urgency(liver, LIVER_T.min);
    // 耗时匹配:凑满 60 分钟预算优先,超预算重罚——可提前做的菜不占当餐灶台,轻罚
    const after = (budget ? budget.mins : 0) + r.cook_time_min;
    if (after > config.constraints.meal_time_budget_min) s -= r.prep_ahead ? 1 : 6;
    else if (r.cook_time_min <= 30) s += 1;
    // 食材复用:同一采购批次里已经买过的生鲜,再用一次就不用多买、也不会烂在冰箱
    const bi = batchOf(dayIdx), inBatch = batchIng[bi] || {};
    r.main_ingredients.forEach(m => {
      const ing = ING[m.name];
      if (inBatch[m.name] && ing && ing.storage.batch_priority <= 2) s += 1.5;
    });
    // 重复惩罚:同主料全周越多罚越狠,同一天撞主料再加罚
    r.main_ingredients.forEach(m => {
      s -= 2 * (mainCount[m.name] || 0);
      if ((dayIng[dayIdx] || {})[m.name]) s -= 3;
    });
    return s + Math.random() * 1.2;   // 同分抖动:免得每周菜单一模一样
  };

  const chooseDish = (cats, mealType, dayIdx, budget) => {
    const base = pool(cats, mealType).filter(r => okHere(r, dayIdx));
    let cand = base.filter(r => {
      // 冷却期取绝对值:填充顺序打乱后,先后两天的差可能是负的
      if (used[r.id] !== undefined
          && Math.abs(dayIdx - used[r.id]) < config.constraints.recipe_cooldown_days) return false;
      for (const m of r.main_ingredients) {
        if ((mainCount[m.name] || 0) >= config.constraints.same_main_ingredient_per_week_max) return false;
      }
      return true;
    });
    if (!cand.length) cand = base;   // 池不足时只放宽软约束(冷却、同主料),硬约束仍然生效
    if (!cand.length) return null;
    // 每道只打一次分(含随机抖动),再取最高,避免比较过程中分数漂移
    const best = cand.map(r => ({ r, s: score(r, dayIdx, budget) }))
                     .reduce((a, b) => (b.s > a.s ? b : a)).r;
    return take(best, dayIdx, budget);
  };

  const drinks = config.meals.breakfast.drink_rotation;
  const bfStaples = config.meals.breakfast.staple_rotation;
  const grains = config.meals.breakfast.grain_rotation;

  let grainIdx = 0;   // 杂粮日单独计数,保证一周里的杂粮品种不重样
  const dinnerStaples = config.meals.dinner.staple_rotation || ['馒头'];
  let stapleIdx = 0;
  // 填充顺序打乱:固定从周一开始填,等于每周都让周一先挑,全库分最高的那道菜
  // 就会周周落在周一(7 月里就是番茄龙利鱼)。天序随机后,好菜落在哪天由运气决定。
  // 注意只打乱「填的先后」,每天自己的 dayIdx 不变,采购日/面食夜/汤夜都还认原来的日子。
  const fillOrder = shuffle(DAYS.map((_, i) => i));
  const days = new Array(DAYS.length);
  fillOrder.forEach((i) => {
    const staple = bfStaples[i % bfStaples.length];
    const grain = staple === '杂粮' ? grains[grainIdx++ % grains.length] : null;
    // 早餐不上炒菜:饮品 + 主食 + 蛋
    // 稀饭配牛奶是两碗水,同一天不排(规则写在 config.breakfast.drink_conflicts)
    let drink = drinks[i % drinks.length];
    const conflicts = (config.meals.breakfast.drink_conflicts || {})[staple] || [];
    if (conflicts.includes(drink)) {
      const alt = drinks.find(d => !conflicts.includes(d));
      if (alt) drink = alt;
    }
    const breakfast = {
      drink,
      staple: grain ? `${staple}(${grain})` : staple,
      egg: '蛋 × 每人1个'
    };
    // 每餐一个耗时预算,评分函数据此把一餐压在 60 分钟内
    const lb = { mins: 0 }, db = { mins: 0 };
    const lunch = { meat: chooseDish(['荤','半荤'], 'lunch', i, lb), veg: chooseDish(['素'], 'lunch', i, lb), staple: '米饭' };

    // 面食仅晚餐、≤3 次/周:命中时从 主食 菜谱池里选,面条本身带荤带素,当晚不再另排荤菜
    // 不是面食夜的晚上不吃米饭,走馒头/花卷轮换(米饭只在午餐)
    let noodleDish = null, dinnerStaple = null;
    if (noodle < noodleMax && noodleDays.has(i)) {
      noodleDish = chooseDish(['主食'], 'dinner', i, db);
      if (noodleDish) { dinnerStaple = noodleDish; noodle++; }
    }
    if (!dinnerStaple) dinnerStaple = dinnerStaples[stapleIdx++ % dinnerStaples.length];
    // 有汤的晚上:菜 + 汤合计 ≤2,所以汤夜不再排素菜
    const hasSoup = soupDays.has(i);
    const dinner = {
      meat: noodleDish ? null : chooseDish(['荤','半荤'], 'dinner', i, db),
      veg: hasSoup ? null : chooseDish(['素'], 'dinner', i, db),
      staple: dinnerStaple,
      soup: hasSoup ? chooseDish(['汤'], 'dinner', i, db) : null
    };
    days[i] = { breakfast, lunch, dinner };
    daysDone++;
  });
  enforceWeekly(days);
  return { days, month, generatedAt: Date.now() };
}

// 每周硬约束下限:猪肝 1-2 次(宝宝补铁)、鱼 2-3 次。随机排菜不保证命中,这里做补位。
// 上限由 generateWeek 的 okHere 在选菜时就挡住,所以这里只需要往上补。
// 补位优先于「同主料每周 ≤2 次」的软约束——营养缺口不能靠运气。
function enforceWeekly(days) {
  const count = (names) => days.reduce((n, d) => n + dishesOfDay(d)
    .filter(id => { const r = R(id); return r && hasIng(r, names); }).length, 0);

  const inject = (names) => {
    const cands = recipes.items.filter(r => recipeInSeason(r) && hasIng(r, names)
      && ['荤','半荤'].includes(r.category));
    if (!cands.length) return false;
    // 可替换的荤菜位:面食夜没有荤菜位;已满足鱼/肝要求的位子不动
    // 含不隔夜鲜货的菜只能落在采购当天
    const free = [];
    days.forEach((d, i) => ['lunch','dinner'].forEach(k => {
      const cur = R(d[k].meat);
      if (cur && !hasIng(cur, FISH) && !hasIng(cur, ['猪肝'])) free.push([i, k]);
    }));
    if (!free.length) return false;
    const r = pick(cands);
    const sameDay = hasIng(r, SAME_DAY);
    const opts = free.filter(([i, k]) => r.meal_type.includes(k) && (!sameDay || BUY_DAYS.includes(i)));
    if (!opts.length) return false;
    const [i, k] = pick(opts);
    days[i][k].meat = r.id;
    return true;
  };

  let guard = 0;
  while (count(['猪肝']) < LIVER_T.min && guard++ < 8) { if (!inject(['猪肝'])) break; }
  guard = 0;
  while (count(FISH) < FISH_T.min && guard++ < 8) { if (!inject(FISH)) break; }
}

const SLOT_CATS = { meat: ['荤','半荤'], soup: ['汤'], staple: ['主食'], veg: ['素','小菜'] };
const swapPool = (cur, mealKey, slot) =>
  pool(SLOT_CATS[slot] || ['素','小菜'], mealKey === 'breakfast' ? 'lunch' : mealKey)
    .filter(r => r.id !== cur);
// 按钮上显示还剩几道能换,换到没得换时按钮置灰
const swapCount = (r, mealKey, slot) => swapPool(r.id, mealKey, slot).length;

function swapDish(dayIdx, mealKey, slot) {
  const cur = week.days[dayIdx][mealKey][slot];
  const cand = swapPool(cur, mealKey, slot);
  if (!cand.length) return;
  lastSwap = { dayIdx, mealKey, slot, was: cur };   // 换错了能退回来
  week.days[dayIdx][mealKey][slot] = pick(cand).id;
  store.set('week', week); render();
}
function undoSwap() {
  if (!lastSwap) return;
  const { dayIdx, mealKey, slot, was } = lastSwap;
  week.days[dayIdx][mealKey][slot] = was;
  lastSwap = null;
  store.set('week', week); render();
}

// ---------- 本周体检 ----------
// 早餐不含菜谱(饮品/主食/蛋都是模板项),所以不进这个列表
const dishesOfDay = (d) => [d.lunch.meat, d.lunch.veg, d.lunch.staple,
                            d.dinner.meat, d.dinner.veg, d.dinner.staple, d.dinner.soup].filter(Boolean);
const hasIng = (r, names) => r.main_ingredients.some(m => names.includes(m.name));

function weekStats(w) {
  w = w || week;
  let fish = 0, liver = 0, noodles = 0, soups = 0, babyOk = 0, seasonal = 0, total = 0;
  w.days.forEach(d => {
    dishesOfDay(d).forEach(id => {
      const r = R(id); if (!r) return;
      total++;
      if (r.baby_variant.suitable) babyOk++;
      if (r.season_months !== 'all') seasonal++;
      if (hasIng(r, FISH)) fish++;
      if (hasIng(r, ['猪肝'])) liver++;
      if (r.category === '主食') noodles++;
    });
    if (d.dinner.soup) soups++;
  });
  return {
    fish:    { n: fish,    min: FISH_T.min,  max: FISH_T.max,                     label: '鱼', mode: 'range' },
    liver:   { n: liver,   min: LIVER_T.min, max: LIVER_T.max,                    label: '猪肝', mode: 'range' },
    noodles: { n: noodles, max: config.constraints.noodle_per_week_max,           label: '面食', mode: 'max' },
    soups:   { n: soups,   max: config.constraints.soup_per_week_max,             label: '汤',  mode: 'max' },
    season:  { n: seasonal, target: total,                                        label: '当季', mode: 'ratio' },
    baby:    { n: babyOk,  target: total,                                         label: '宝宝可吃', mode: 'ratio' }
  };
}

// 体检条只做「本周达标没有」的仪表盘,不兼作筛选器——点进去挑菜不是这一行该干的事
function renderHealth(w) {
  const s = weekStats(w);
  const chip = (k) => {
    const c = s[k];
    // 宝宝那条用宝宝色,当季那条用常规色——一屏里只留一个强调色
    if (c.mode === 'ratio') return `<span class="chip ${k === 'baby' ? 'baby' : ''}"><i class="dot"></i>${c.label} <b>${c.n}/${c.target}</b></span>`;
    if (c.mode === 'range') {
      const bad = c.n < c.min || c.n > c.max;
      return `<span class="chip ${bad ? 'warn' : ''}"><i class="dot"></i>${c.label} <b>${c.n}</b>/${c.min}-${c.max}</span>`;
    }
    const bad = c.n > c.max;
    return `<span class="chip ${bad ? 'warn' : ''}"><i class="dot"></i>${c.label} <b>${c.n}</b>/≤${c.max}</span>`;
  };
  return `<div class="health">${['fish','liver','noodles','soups','season','baby'].map(chip).join('')}</div>`;
}

// ---------- 购物清单 ----------
const isShelf = (name) => ING[name] && ING[name].storage.batch_priority === 3;

function shoppingBatches() {
  if (!week) return [];
  // 每批从采购当天管起(采购日与覆盖范围全读 config.batch_coverage,不写死),
  // 这样不隔夜的鱼虾就能排在采购当天吃
  const cov = config.shopping.batch_coverage;
  const buyDays = Object.keys(cov);
  const batchDays = buyDays.map(d => cov[d].map(x => DAYS.indexOf(x)).filter(i => i >= 0));
  const names = buyDays.map((d, i) =>
    `${d}采购(管${cov[d][0]}至${cov[d][cov[d].length - 1]}${i === 0 ? ' + 全周耐储' : ''})`);
  return batchDays.map((dIdxs, bi) => {
    const need = {};
    const add = (rid, mode) => {          // mode: 'fresh' 只加生鲜 | 'shelf' 只加耐储
      const r = R(rid); if (!r) return;   // '米饭' 等非菜谱字符串自然跳过
      r.main_ingredients.forEach(m => {
        const shelf = isShelf(m.name);
        if (mode === 'fresh' && shelf) return;
        if (mode === 'shelf' && !shelf) return;
        need[m.name] = (need[m.name] || 0) + m.qty_g;
      });
    };
    dIdxs.forEach(di => dishesOfDay(week.days[di]).forEach(id => add(id, 'fresh')));
    // 耐储类(batch_priority 3)按全周需求一次性并入第一批,第二批不再重复出现
    if (bi === 0) week.days.forEach(d => dishesOfDay(d).forEach(id => add(id, 'shelf')));

    const byCat = {};
    Object.entries(need).forEach(([name, g]) => {
      const ing = ING[name];
      const cat = ing ? ing.category : '其他';
      (byCat[cat] = byCat[cat] || []).push({ name, g, ing });
    });
    // 不隔夜的排最前,其次按先吃顺序
    Object.values(byCat).forEach(list => list.sort((a, b) =>
      (b.ing?.same_day ? 1 : 0) - (a.ing?.same_day ? 1 : 0) ||
      (a.ing?.storage.batch_priority ?? 9) - (b.ing?.storage.batch_priority ?? 9)));
    return { name: names[bi], byCat, key: 'b' + bi };
  });
}

function toggleBought(key, name) {
  const k = key + '|' + name;
  bought[k] = !bought[k];
  store.set('bought', bought); render();
}

// ---------- 渲染 ----------
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function dishRow(rid, dayIdx, mealKey, slot, readonly) {
  const r = R(rid);
  if (!r) return '';
  const spicy = r.spicy ? `<span class="spicy">${'辣'.repeat(r.spicy)}</span>` : '';
  const noodleTag = r.category === '主食' ? `<span class="tag noodle">面食</span>` : '';
  // 限定月份的菜标「当季」:全年都能做的菜不标,免得满屏都是
  const seasonTag = r.season_months !== 'all' ? `<span class="tag season">当季</span>` : '';
  // 全库 88% 的菜宝宝都能吃,逐道标「宝宝可吃」等于没标。只标例外:
  // 不吃的常显红牌,能吃的给一个可点开的小钮,想看分菜时机再展开
  const bv = r.baby_variant;
  const key = `${dayIdx}-${mealKey}-${slot}`;
  const babyTag = bv.suitable
    ? `<button class="baby-mini ${openBaby[key] ? 'on' : ''}" onclick="toggleBaby('${key}')">宝${openBaby[key] ? ' ▲' : ' ▼'}</button>`
    : `<span class="tag baby-no">宝宝不吃</span>`;
  const cand = readonly ? 0 : swapCount(r, mealKey, slot);
  // 刚换过的这一位就地给一个撤销,不用跑到页面顶上去找
  const justSwapped = lastSwap && lastSwap.dayIdx === dayIdx
    && lastSwap.mealKey === mealKey && lastSwap.slot === slot;
  return `<div class="dish">
    <div><span class="dish-name">${esc(r.name)}</span>${babyTag}${spicy}${noodleTag}${seasonTag}
      <span class="dish-meta">${r.cook_time_min}分${r.prep_ahead ? '·可提前' : ''}</span></div>
    ${readonly ? '' : `<span class="swap-wrap">${
      justSwapped ? `<button class="swap undo" onclick="undoSwap()">撤销</button>` : ''}
      <button class="swap" ${cand ? '' : 'disabled'}
       onclick="swapDish(${dayIdx},'${mealKey}','${slot}')">换一换</button></span>`}
  </div>${babyLine(r, key)}`;
}
function babyLine(r, key) {
  const bv = r.baby_variant;
  // 宝宝不吃的必须常显——那是当餐要另想办法的;能吃的默认收起,点「宝」才展开
  if (!bv.suitable) return `<div class="baby-row na">此菜宝宝不吃:${esc(bv.unsuitable_reason)}</div>`;
  if (!openBaby[key]) return '';
  return `<div class="baby-row">${esc(bv.split_point)};${esc(bv.modification)}</div>`;
}
function toggleBaby(key) { openBaby[key] = !openBaby[key]; store.set('openBaby', openBaby); render(); }
function mealLoad(m) {
  const rs = [m.meat, m.veg, m.staple, m.soup].filter(Boolean).map(R).filter(Boolean);
  return { mins: rs.reduce((s, r) => s + r.cook_time_min, 0), prepAhead: rs.some(r => r.prep_ahead) };
}

function renderGrid(w) {
  // 只标例外:宝宝不吃的挂灰章,能吃的什么都不挂(占全库 88%,标了等于没标)
  const dot = (r) => `<span>${r.baby_variant.suitable ? '' : '<i class="bdot no">宝</i>'}${esc(r.name)}</span>`;
  const cell = (m, key) => {
    const rows = [];
    // 早餐全是模板项(饮品/主食/蛋),没有菜谱
    if (key === 'breakfast') {
      rows.push(`<span>${esc(m.staple)}</span>`);
      rows.push(`<span class="sub">${esc(m.drink)}</span>`);
      rows.push(`<span class="sub">蛋 × 每人1个</span>`);
    }
    [m.meat, m.veg, m.soup].filter(Boolean).map(R).filter(Boolean).forEach(r => rows.push(dot(r)));
    if (key !== 'breakfast') {
      const st = R(m.staple);                       // 面食夜:主食是菜谱;否则是「米饭」
      rows.push(st ? dot(st) : `<span class="sub">${esc(m.staple)}</span>`);
    }
    if (!rows.length) rows.push('<span class="nob">—</span>');
    return `<div class="grid-cell">${rows.join('')}</div>`;
  };
  return `<div class="grid">
    <div class="grid-row head"><div></div><div>早</div><div>午</div><div>晚</div></div>
    ${w.days.map((d, i) => `
      <div class="grid-row ${i === todayIdx && w === week ? 'today' : ''}">
        <div class="grid-day">${DAYS[i].slice(1)}</div>
        ${cell(d.breakfast, 'breakfast')}${cell(d.lunch, 'lunch')}${cell(d.dinner, 'dinner')}
      </div>`).join('')}
  </div>
  <div class="footnote">挂 <i class="bdot">宝</i> 的菜宝宝能吃 · 今天这行有底色 · 切到「详细」看分菜时机和换一换</div>`;
}

function renderDays(w, readonly) {
  return w.days.map((d, i) => `
    <section class="day">
      <div class="day-label"><em>${DAYS[i]}</em>${i === todayIdx && !readonly ? '<span class="today-flag">今天</span>' : ''}</div>
      ${MEALS.map(([key, label]) => {
        const m = d[key];
        const { mins, prepAhead } = mealLoad(m);
        const over = mins > config.constraints.meal_time_budget_min;
        let inner = '';
        if (key === 'breakfast') {
          const stapleKey = m.staple.replace(/\(.+\)/, '');
          const drinkKey = /豆浆/.test(m.drink) ? '豆浆' : m.drink;
          const drinkTip = (babyRules.breakfast_drink_rule || {})[drinkKey];
          inner = `<div class="dish"><span class="dish-name">${esc(m.drink)}</span><span class="tag">饮品</span></div>
            ${drinkTip ? `<div class="baby-row">${esc(drinkTip)}</div>` : ''}
            <div class="dish"><span class="dish-name">${esc(m.staple)}</span><span class="tag">主食</span></div>
            <div class="baby-row">${esc(babyRules.breakfast_adaptation[stapleKey] || babyRules.breakfast_adaptation['杂粮'])}</div>
            <div class="dish"><span class="dish-name">${esc(m.egg)}</span><span class="tag">蛋</span></div>`;
        } else {
          inner = [m.meat && dishRow(m.meat, i, key, 'meat', readonly),
                   m.veg && dishRow(m.veg, i, key, 'veg', readonly),
                   R(m.staple) ? dishRow(m.staple, i, key, 'staple', readonly)
                               : `<div class="dish"><span class="dish-name">${esc(m.staple)}</span><span class="tag">主食</span></div>`,
                   m.soup && dishRow(m.soup, i, key, 'soup', readonly)].filter(Boolean).join('');
        }
        return `<div class="meal">
          <div class="meal-head"><span class="meal-name">${label}</span>
            ${mins ? `<span class="meal-time ${over ? 'over' : ''}">${mins} 分${over ? (prepAhead ? ' · 有可提前做的菜' : ' · 超单餐预算') : ''}</span>` : ''}</div>
          ${inner}</div>`;
      }).join('')}
    </section>`).join('');
}

// 打开页面最想知道的是「今天做什么」,所以今天单独一张卡放最上面,一周概览往下挪
function renderToday() {
  const d = week.days[todayIdx];
  const line = (m, label) => {
    const rs = [m.meat, m.veg, m.soup].filter(Boolean).map(R).filter(Boolean);
    const st = R(m.staple);
    const names = rs.map(r => `<b>${esc(r.name)}</b>`).concat(st ? [`<b>${esc(st.name)}</b>`] : [esc(m.staple)]);
    const { mins, prepAhead } = mealLoad(m);
    const bad = [...rs, st].filter(Boolean).filter(r => !r.baby_variant.suitable);
    return `<div class="today-meal">
      <div class="today-label">${label}<span class="today-mins">${mins} 分${prepAhead ? '·有可提前的' : ''}</span></div>
      <div class="today-dishes">${names.join('<span class="sep">·</span>')}</div>
      ${bad.length ? `<div class="today-warn">${bad.map(r => esc(r.name)).join('、')}宝宝不吃,当餐另备</div>` : ''}
    </div>`;
  };
  return `<section class="today-card">
    <div class="today-head">今天 · ${DAYS[todayIdx]}</div>
    ${line(d.lunch, '午餐')}${line(d.dinner, '晚餐')}
  </section>`;
}

// 菜单不会自己过期,跨周之后页面原样显示,容易照着上周的单子做饭
function staleBanner() {
  const days = Math.floor((Date.now() - week.generatedAt) / 86400000);
  if (days < 7) return '';
  return `<div class="stale">这份菜单是 <b>${days} 天前</b>排的,时令和采购批次可能都对不上了 — 建议重新生成。</div>`;
}

function renderMenu() {
  if (!week) return `<div class="empty">还没有本周菜单。<br>点上面的按钮,10 秒生成。</div>`;

    <div class="ov-toggle">

      <button class="${overview ? '' : 'on'}" onclick="setOverview(false)">详细</button>
    </div>` + (overview ? renderGrid(week) : renderDays(week, false));
}
function setOverview(v) { overview = v; store.set('overview', v); render(); }

// 早餐是模板项不是菜谱,单列一块常备清单(按包装买,不算克重)
function breakfastNeeds() {
  const drinks = {}, staples = {}, dinnerStaples = {};
  week.days.forEach(d => {
    const dr = d.breakfast.drink, st = d.breakfast.staple;   // st 可能是「杂粮(玉米)」
    drinks[dr] = (drinks[dr] || 0) + 1;
    staples[st] = (staples[st] || 0) + 1;
    // 晚餐的馒头/花卷和早餐主食一样是按包装买的模板项,不是菜谱,得单列出来才不会漏买
    if (!R(d.dinner.staple)) dinnerStaples[d.dinner.staple] = (dinnerStaples[d.dinner.staple] || 0) + 1;
  });
  return { drinks, staples, dinnerStaples, eggs: 7 * (config.family.adults + 1) };
}

function renderBreakfastBlock() {
  const n = breakfastNeeds();
  const rows = (obj) => Object.entries(obj)
    .map(([k, v]) => `<div class="bf-item"><span>${esc(k)}</span><span class="times">${v} 天</span></div>`).join('');
  return `<section class="batch">
    <div class="batch-head"><span>常备</span><span class="prog">按包装买</span></div>
    <div class="cat-block"><div class="cat-title">早餐饮品</div>${rows(n.drinks)}</div>
    <div class="cat-block"><div class="cat-title">早餐主食</div>${rows(n.staples)}</div>
    ${Object.keys(n.dinnerStaples).length ? `<div class="cat-block"><div class="cat-title">晚餐主食</div>${rows(n.dinnerStaples)}</div>` : ''}
    <div class="cat-block"><div class="cat-title">蛋</div>
      <div class="bf-item"><span>鸡蛋</span><span class="times">约 ${n.eggs} 个 / 周</span></div></div>
  </section>`;
}

function setShopFilter(k) {
  shopFilter = shopFilter === k ? null : k;
  store.set('shopFilter', shopFilter); render();
}

// 两位掌勺各看一份:清单转成纯文本,复制走微信发给对方
function shopText() {
  const n = breakfastNeeds();
  const lines = ['【常备·按包装买】'];
  Object.entries(n.drinks).forEach(([k, v]) => lines.push(`  ${k} ${v} 天`));
  Object.entries(n.staples).forEach(([k, v]) => lines.push(`  ${k} ${v} 天`));
  Object.entries(n.dinnerStaples).forEach(([k, v]) => lines.push(`  ${k} ${v} 天`));
  lines.push(`  鸡蛋 约 ${n.eggs} 个`);
  shoppingBatches().forEach(b => {
    lines.push('', `【${b.name}】`);
    Object.entries(b.byCat).forEach(([cat, items]) => {
      lines.push(` ${cat}`);
      items.forEach(it => {
        const q = it.g >= 1000 ? (it.g / 1000).toFixed(1) + 'kg' : it.g + 'g';
        const hint = it.ing && it.ing.pack_hint ? `(${it.ing.pack_hint})` : '';
        const today = it.ing && it.ing.same_day ? ' ※当天吃' : '';
        lines.push(`  ${bought[b.key + '|' + it.name] ? '✓' : '□'} ${it.name} ${q}${hint}${today}`);
      });
    });
  });
  return lines.join('\n');
}
function copyShop() {
  const txt = shopText();
  const done = () => { copied = true; render(); setTimeout(() => { copied = false; render(); }, 2000); };
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done));
  else fallbackCopy(txt, done);
}
function fallbackCopy(txt, done) {
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch { alert(txt); }
  document.body.removeChild(ta);
}

function renderShop() {
  if (!week) return `<div class="empty">先生成本周菜单,买菜清单会自动出来。</div>`;
  const batches = shoppingBatches();
  // 到店只想看一批的时候,把另一批和早餐常备收起来
  const opts = [['bf', '早餐常备'], ...batches.map((b, i) => ['b' + i, Object.keys(config.shopping.batch_coverage)[i] + '采购'])];
  const filters = `<div class="filters">${opts.map(([k, label]) =>
    `<button class="${shopFilter === k ? 'on' : ''}" onclick="setShopFilter('${k}')">${esc(label)}</button>`).join('')}
    <button class="copy-btn" onclick="copyShop()">${copied ? '已复制 ✓' : '复制清单'}</button></div>`;
  const show = (k) => !shopFilter || shopFilter === k;
  return filters + (show('bf') ? renderBreakfastBlock() : '') + batches.filter(b => show(b.key)).map(b => {
    const all = Object.values(b.byCat).flat();
    const done = all.filter(it => bought[b.key + '|' + it.name]).length;
    return `
    <section class="batch">
      <div class="batch-head"><span>${esc(b.name)}</span><span class="prog">${done}/${all.length}</span></div>
      <div class="bar"><i style="width:${all.length ? done / all.length * 100 : 0}%"></i></div>
      ${Object.entries(b.byCat).map(([cat, items]) => `
        <div class="cat-block"><div class="cat-title">${esc(cat)}</div>
          ${items.map(it => {
            const s = it.ing ? it.ing.storage : null;
            const sameDay = !!(it.ing && it.ing.same_day);
            const urgent = s && s.batch_priority === 1;
            const on = !!bought[b.key + '|' + it.name];
            const tip = s ? (sameDay ? esc(s.method)
                                     : `${esc(s.method)},${s.max_days} 天内吃完${urgent ? ' · 先吃' : ''}`) : '';
            return `<div class="shop-item ${on ? 'done' : ''}" onclick="toggleBought('${b.key}','${esc(it.name)}')">
              <span class="box">${on ? '✓' : ''}</span>
              <span class="grow"><span class="s-name">${esc(it.name)}</span>${sameDay ? '<span class="badge-today">当天吃</span>' : ''}
                ${tip ? `<div class="storage-tip ${urgent && !sameDay ? '' : 'plain'}">${tip}</div>` : ''}
              </span>
              <span class="shop-qty">${it.g >= 1000 ? (it.g/1000).toFixed(1) + ' kg' : it.g + ' g'}${
                it.ing && it.ing.pack_hint ? `<i class="pack">${esc(it.ing.pack_hint)}</i>` : ''}</span></div>`;
          }).join('')}
        </div>`).join('')}
    </section>`;
  }).join('') +
  `<div class="footnote">点一下划掉已买的 · 份量为菜谱累加的净需求,采购时按包装规格就近取整<br>耐储类(米面粮油、根茎瓜类)按全周用量并入第一批,后面几批只补生鲜</div>`;
}

    <div><span class="dish-name" style="font-size:15px">${esc(r.name)}</span>${

  </div>`;
  if (!open) return `<div class="rec-row">${head}</div>`;

  const mains = r.main_ingredients.map(m =>
    `<span class="ing-chip">${esc(m.name)} <b>${m.qty_g >= 1000 ? (m.qty_g/1000).toFixed(1) + 'kg' : m.qty_g + 'g'}</b></span>`).join('');
  const aux = (r.aux || []).length ? `<div class="rec-line"><em>辅料</em>${(r.aux || []).map(esc).join('、')}</div>` : '';

    : `<div class="baby-row na">此菜宝宝不吃:${esc(bv.unsuitable_reason)}</div>`;
  const steps = r.steps_brief
    ? `<div class="rec-line"><em>做法</em>${esc(r.steps_brief)}</div>`
    : `<div class="rec-line plain"><em>做法</em>家常做法,按你平时的来;这一栏只给宝宝重点菜和生僻菜写要点。</div>`;
  const tags = (r.tags || []).map(t => `<span class="rec-tag">${esc(t)}</span>`).join('');

  return `<div class="rec-row open">${head}
    <div class="rec-detail">
      <div class="rec-line"><em>主料</em><span class="ing-chips">${mains}</span></div>
      ${aux}${steps}${babyBlock}
      <div class="rec-line"><em>标签</em>${tags}<span class="rec-tag season-tag">${
        r.season_months === 'all' ? '全年' : monthsOf(r.season_months).join('/') + ' 月'}</span></div>
    </div>
  </div>`;
}

function renderSeason() {
  const mm = seasonMonth;                       // 0 = 全年,看整个库有什么
  const allMonths = mm === 0;
  const inSel = (m) => allMonths || inMonth(m, mm);
  const ings = ingredients.items.filter(i => inSel(i.season_months));
  const recs = recipes.items.filter(r => inSel(r.season_months));

  // 筛选按标签页分开:食材页问「买什么」,菜谱页问「做什么」,不再混在一行里
  const FILTERS = seasonTab === 'ing'
    ? { baby: { label: '宝宝能吃', fn: i => i.baby_ok },
        fresh: { label: '当天吃', fn: i => i.same_day } }
    : { baby: { label: '宝宝能吃', fn: r => r.baby_variant.suitable },
        mild: { label: '不辣', fn: r => !r.spicy },
        quick: { label: '30 分内', fn: r => r.cook_time_min <= 30 },
        fresh: { label: '当天吃', fn: r => hasIng(r, SAME_DAY) } };
  const f = FILTERS[seasonFilter];
  let shownIngs = seasonTab === 'ing' && f ? ings.filter(f.fn) : ings;
  let shownRecs = seasonTab === 'rec' && f ? recs.filter(f.fn) : recs;
  // 搜索:77 道菜 84 项食材,光靠筛选找不到具体某一样。菜谱连主料一起搜
  const q = seasonQ.trim();
  if (q) {
    shownIngs = shownIngs.filter(i => i.name.includes(q));
    shownRecs = shownRecs.filter(r => r.name.includes(q) || r.main_ingredients.some(m => m.name.includes(q)));
  }

  // 品类:食材按叶菜/水果…,菜谱按荤/素/汤…,同一个位置、同一套交互
  const cats = seasonTab === 'ing'
    ? [...new Set(ingredients.items.map(i => i.category))]
    : ['荤','半荤','素','小菜','汤','主食'];
  const countIn = (c) => seasonTab === 'ing'
    ? ings.filter(i => i.category === c).length : recs.filter(r => r.category === c).length;
  if (seasonCat) {
    shownIngs = shownIngs.filter(i => i.category === seasonCat);
    shownRecs = shownRecs.filter(r => r.category === seasonCat);
  }
  const catBar = `<div class="filters cat-bar">${cats.filter(c => countIn(c)).map(c =>
    `<button class="${seasonCat === c ? 'on' : ''}" onclick="setSeasonCat('${esc(c)}')">${esc(c)} ${countIn(c)}</button>`
  ).join('')}</div>`;

  const strip = `<div class="month-strip">${MONTHS.map(m =>
    `<button class="${m === mm ? 'on' : ''} ${m === month ? 'now' : ''}" onclick="setSeasonMonth(${m})">${m}</button>`
  ).join('')}<button class="all ${allMonths ? 'on' : ''}" onclick="setSeasonMonth(0)">全年</button></div>`;

  // 标签页放在筛选之前:先决定看食材还是看菜,再谈怎么筛
  const tabs = `<div class="ov-toggle">
    <button class="${seasonTab === 'ing' ? 'on' : ''}" onclick="setSeasonTab('ing')">食材 ${shownIngs.length}</button>
    <button class="${seasonTab === 'rec' ? 'on' : ''}" onclick="setSeasonTab('rec')">菜谱 ${shownRecs.length}</button>
  </div>`;

  const filters = `<div class="filters">${Object.entries(FILTERS).map(([k, v]) =>
    `<button class="${seasonFilter === k ? 'on' : ''}" onclick="toggleSeasonFilter('${k}')">${v.label}</button>`
  ).join('')}</div>`;

  // 搜了但当月没有:多半是东西在库里、只是不在这个月,直接给一个跳「全年」的出口
  const hitCount = seasonTab === 'ing' ? shownIngs.length : shownRecs.length;
  const inLib = !q ? 0 : (seasonTab === 'ing'
    ? ingredients.items.filter(i => i.name.includes(q)).length
    : recipes.items.filter(r => r.name.includes(q) || r.main_ingredients.some(m => m.name.includes(q))).length);
  const missHint = q && !hitCount && inLib && !allMonths
    ? `<div class="miss-hint">「${esc(q)}」在库里有 <b>${inLib}</b> 项,但都不在 ${mm} 月。
       <button onclick="setSeasonMonth(0)">看全年</button></div>`
    : (q && !hitCount ? `<div class="miss-hint">没有匹配「${esc(q)}」的结果。</div>` : '');

  let body = '';
  if (seasonTab === 'ing') {
    const byCat = {};
    shownIngs.forEach(i => (byCat[i.category] = byCat[i.category] || []).push(i));
    body = Object.entries(byCat).map(([cat, list]) => `
      <div class="ing-block"><div class="cat-title">${esc(cat)}</div>
        ${list.map(i => {
          const ms = monthsOf(i.season_months);
          const s = i.storage;
          // 买回来怎么放、几天内吃完,和在不在季一样是买菜当场要看的
          const keep = `${esc(s.method)} · ${i.same_day ? '当天吃完' : s.max_days + ' 天内吃完'}${
            s.batch_priority === 1 ? ' · 先吃' : s.batch_priority === 3 ? ' · 耐储' : ''}`;
          return `<div class="ing-row">
            <div>
              <div class="ing-name">${esc(i.name)}${i.same_day ? '<span class="badge-today">当天吃</span>' : ''}${
                i.baby_ok ? '' : '<span class="nb">宝宝不吃</span>'}</div>
              <div class="ing-keep ${s.batch_priority === 1 ? 'urgent' : ''}">${keep}</div>
            </div>
            <div class="bars">${MONTHS.map(m =>
              `<i class="${ms.includes(m) ? 'on' : ''} ${m === mm ? 'sel' : ''}"></i>`).join('')}</div>
          </div>`;
        }).join('')}
      </div>`).join('') +
      `<div class="legend">每行右侧是全年 12 个月的上市情况,深色=在季,方框=当前选中的月份。<br>名字下面那行是储存方式和该吃完的期限,暖色=到手先吃。「当天吃」的食材不隔夜,排菜时只会排在采购当天。</div>`;
  } else {
    const byCat = {};
    shownRecs.forEach(r => (byCat[r.category] = byCat[r.category] || []).push(r));
    const order = ['荤','半荤','汤','素','小菜','主食'];
    body = order.filter(c => byCat[c]).map(cat => `
      <div class="ing-block"><div class="cat-title">${esc(cat)} ${byCat[cat].length}</div>
        ${byCat[cat].map(r => renderRecRow(r)).join('')}
      </div>`).join('') +
      `<div class="legend">${allMonths ? '列出全库所有菜' : '只列 ' + mm + ' 月能做的菜'}。菜谱的时令 = 所有主料时令的交集,所以主料一过季,菜就自动从这里消失,也不会再被排进菜单。<br>点菜名展开:用什么料、多少量、宝宝份什么时候盛。</div>`;
  }

  return `<div class="season-page">
    ${strip}
    <div class="health">
      <span class="chip"><i class="dot"></i>${allMonths ? '全库' : mm + ' 月在季'} <b>${ings.length}</b>/${ingredients.items.length} 食材</span>
      <span class="chip"><i class="dot"></i>可做 <b>${recs.length}</b>/${recipes.items.length} 道菜</span>
    </div>
    ${tabs}
    <div class="search-box"><input id="season-q" type="search" value="${esc(seasonQ)}"
      placeholder="${seasonTab === 'ing' ? '搜食材,如 苹果' : '搜菜名或主料,如 红烧 / 排骨'}"
      oninput="setSeasonQ(this.value)">${seasonQ ? `<button onclick="setSeasonQ('')">清除</button>` : ''}</div>
    ${catBar}${filters}${missHint}${body}
  </div>`;
}

// ---------- 今晚吃什么 ----------
// 定位:不替代周菜单,是「今天不想吃排好的那道」时的逃生口。
// 一次只给 3 个候选——把「从 77 道里挑」压缩成「从 3 个里挑」,决策成本是固定的。
// 不设次数上限:限次是游戏化包装,对做饭这件事只是添堵。

const DRAW_SLOTS = {
  spicy: { label: '辣度', opts: [['mild', '不辣', r => !r.spicy], ['hot', '要辣', r => r.spicy >= 1]] },
  time:  { label: '耗时', opts: [['quick', '快手 ≤30分', r => r.cook_time_min <= 30],
                                 ['slow', '慢炖', r => r.cook_time_min > 30]] },
  kind:  { label: '荤素', opts: [['meat', '荤', r => ['荤','半荤'].includes(r.category)],
                                 ['veg', '素', r => ['素','小菜'].includes(r.category)]] }
};
function setDrawSlot(k, v) {
  drawSlots[k] = drawSlots[k] === v ? null : v;
  store.set('drawSlots', drawSlots); render();
}

// 候选走的是排菜那套:硬约束先过滤(不隔夜鲜货只在采购当天、鱼/猪肝周上限、冷却期),
// 再按评分取前段加权随机——所以给出来的一定是「今天真能做」的,不是纯随机。
function drawCards() {
  const todayBuy = BUY_DAYS.includes(todayIdx);
  const inWeek = {};
  if (week) week.days.forEach((d, i) => dishesOfDay(d).forEach(id => { inWeek[id] = i; }));

  let cand = recipes.items.filter(r => {
    if (!recipeInSeason(r)) return false;
    if (!r.meal_type.includes('dinner')) return false;
    if (hasIng(r, SAME_DAY) && !todayBuy) return false;          // 不隔夜的鲜货:今天不是采购日就抽不到
    if (inWeek[r.id] !== undefined) return false;                 // 本周已经排过的不再抽
    if (r.category === '汤') return false;                        // 汤是插入项,不作主菜抽
    for (const k in DRAW_SLOTS) {                                 // 条件槽
      const v = drawSlots[k];
      if (!v) continue;
      const opt = DRAW_SLOTS[k].opts.find(o => o[0] === v);
      if (opt && !opt[2](r)) return false;
    }
    return true;
  });
  if (!cand.length) { draw = { cards: [], empty: true }; store.set('draw', draw); render(); return; }

  // 评分:当季 + 好做 + 用得上冰箱里已经买的东西,取前段再随机,保证既合理又有惊喜
  const batchNow = batchOf(todayIdx);
  const boughtNames = new Set();
  if (week) week.days.forEach((d, i) => { if (batchOf(i) === batchNow)
    dishesOfDay(d).forEach(id => { const r = R(id); if (r) r.main_ingredients.forEach(m => boughtNames.add(m.name)); }); });
  const scored = cand.map(r => {
    let s = 0;
    if (r.season_months !== 'all') s += 3;
    if (r.cook_time_min <= 30) s += 1;
    if (r.baby_variant.suitable) s += 2;
    r.main_ingredients.forEach(m => { if (boughtNames.has(m.name)) s += 1.5; });
    return { r, s: s + Math.random() * 2 };
  }).sort((a, b) => b.s - a.s);

  // 三张牌尽量不同类别:全发素菜等于没得选。没指定荤素时优先凑出荤/素/主食的组合
  const top = scored.slice(0, Math.max(6, Math.ceil(scored.length * 0.5)));
  const kindOf = (r) => ['荤','半荤'].includes(r.category) ? 'meat'
                      : r.category === '主食' ? 'staple' : 'veg';
  const picked = [], usedKinds = new Set();
  while (picked.length < 3 && top.length) {
    // 先锁定还没出现过的类别,再在该类别的候选里随机取——只取分最高的那个,
    // 会导致每次给的都是同几道,换一批就没有意义了
    let idxs = top.map((x, i) => [x, i]).filter(([x]) => !usedKinds.has(kindOf(x.r))).map(([, i]) => i);
    if (!idxs.length) idxs = top.map((_, i) => i);
    const idx = idxs[Math.floor(Math.random() * idxs.length)];
    const [chosen] = top.splice(idx, 1);
    usedKinds.add(kindOf(chosen.r));
    picked.push(chosen.r.id);
  }
  draw = { cards: picked, flipped: {}, at: Date.now() };
  store.set('draw', draw); render();
}
function flipCard(id) {
  draw.flipped = draw.flipped || {};
  draw.flipped[id] = !draw.flipped[id];
  store.set('draw', draw); render();
}
// 选中即写进今天的晚餐荤位(面食类写主食位),购物清单会跟着变
function takeCard(id) {
  if (!week) { alert('先在菜单页生成本周菜单,抽到的菜才有地方放。'); return; }
  const r = R(id); if (!r) return;
  const slot = r.category === '主食' ? 'staple' : ['素','小菜'].includes(r.category) ? 'veg' : 'meat';
  const was = week.days[todayIdx].dinner[slot];
  lastSwap = { dayIdx: todayIdx, mealKey: 'dinner', slot, was };
  week.days[todayIdx].dinner[slot] = id;
  store.set('week', week);
  draw = null; store.set('draw', null);
  view = 'menu'; overview = false; store.set('overview', false);
  render();
}

function renderDraw() {
  const slots = Object.entries(DRAW_SLOTS).map(([k, v]) => `
    <div class="slot"><span class="slot-label">${v.label}</span>
      ${v.opts.map(([id, label]) =>
        `<button class="${drawSlots[k] === id ? 'on' : ''}" onclick="setDrawSlot('${k}','${id}')">${label}</button>`).join('')}
    </div>`).join('');

  let cards = '';
  if (draw && draw.empty) {
    cards = `<div class="empty">这几个条件下今天没有能做的菜。<br>松一个条件再来。</div>`;
  } else if (draw && draw.cards.length) {
    cards = `<div class="cards">${draw.cards.map(id => {
      const r = R(id); if (!r) return '';
      const bv = r.baby_variant, flipped = draw.flipped && draw.flipped[id];
      const face = flipped
        ? `<div class="card-back">
             <div class="card-back-t">宝宝那份</div>
             ${bv.suitable ? `<p>${esc(bv.split_point)}</p><p class="mod">${esc(bv.modification)}</p>`
                           : `<p class="na">这道宝宝不吃:${esc(bv.unsuitable_reason)}</p>`}
           </div>`
        : `<div class="card-front">
             <div class="card-name">${esc(r.name)}</div>
             <div class="card-meta">${r.cook_time_min} 分${r.prep_ahead ? ' · 可提前' : ''}${
               r.spicy ? ` · ${'辣'.repeat(r.spicy)}` : ''}</div>
             <div class="card-tags">${r.season_months !== 'all' ? '<span class="tag season">当季</span>' : ''}${
               bv.suitable ? '' : '<span class="tag baby-no">宝宝不吃</span>'}</div>
             <div class="card-ings">${r.main_ingredients.map(m =>
               `${esc(m.name)} ${m.qty_g >= 1000 ? (m.qty_g/1000).toFixed(1) + 'kg' : m.qty_g + 'g'}`).join('<br>')}</div>
           </div>`;
      return `<div class="card ${flipped ? 'flipped' : ''}">
        ${face}
        <div class="card-actions">
          <button class="flip" onclick="flipCard('${id}')">${flipped ? '翻回来' : '看宝宝份'}</button>
          <button class="take" onclick="takeCard('${id}')">就它</button>
        </div>
      </div>`;
    }).join('')}</div>`;
  } else {
    cards = `<div class="empty">今晚不想吃排好的那道?<br>给你三个候选,挑一个。</div>`;
  }

  return `<div class="draw-page">
    <div class="draw-intro">周菜单已经排好了,这里是给「今天临时想换」用的。给的三个都是今天真能做的:
      不隔夜的鱼虾只在采购当天出现,本周排过的不重复,一荤一素一主食各来一个。</div>
    <div class="slots">${slots}</div>
    <button class="gen-btn draw-btn" onclick="drawCards()">
      ${draw && draw.cards && draw.cards.length ? '换一批候选' : '给我三个候选'}</button>
    ${cards}
    <div class="footnote">一次只给三个,是为了不让你再从 ${recipes.items.length} 道里挑;不满意就换一批。<br>
      选中的菜会替换今天晚餐的对应位置,买菜清单跟着变;选错了到菜单页点「撤销」。</div>
  </div>`;
}

function renderBaby() {
  const b = babyRules;
  const s = week ? weekStats() : null;
  // 数字已经在菜单页的体检条上了,这里不再重复报数;只讲「还差什么、可以补哪道菜」
  const gaps = [];
  if (s) {
    [['fish', FISH, '鱼'], ['liver', ['猪肝'], '猪肝']].forEach(([k, names, label]) => {
      const c = s[k], miss = c.min - c.n;
      if (miss > 0) {
        const cands = recipes.items.filter(r => recipeInSeason(r) && hasIng(r, names)
          && r.baby_variant.suitable).slice(0, 3).map(r => r.name);
        gaps.push(`本周${label}还差 <b>${miss}</b> 次${cands.length ? ',可以补:' + cands.map(esc).join('、') : ''}`);
      } else if (c.n > c.max) {
        gaps.push(`本周${label}排了 <b>${c.n}</b> 次,超过上限 ${c.max}`);
      }
    });
    const noBaby = [];
    week.days.forEach((d, i) => dishesOfDay(d).forEach(id => {
      const r = R(id);
      if (r && !r.baby_variant.suitable) noBaby.push(`${DAYS[i].slice(1)}·${r.name}`);
    }));
    if (noBaby.length) gaps.push(`这几道宝宝不吃,当餐要另备:${noBaby.map(esc).join('、')}`);
  }
  const wk = s ? `<div class="rule-block"><h3>本周还差什么</h3>${
    gaps.length ? `<ul>${gaps.map(g => `<li>${g}</li>`).join('')}</ul>`
                : '<p>鱼、猪肝都在区间内,本周每一餐宝宝都有得吃。</p>'}</div>` : '';
  return `<div class="baby-page">
    ${wk}
    <div class="rule-block"><h3>一天的节奏(${esc(b.age_stage)} · 奶 ${b.milk.total_ml}ml)</h3></div>
    <div class="sched">${b.daily_schedule.default.map(s =>
      `<div class="sched-row"><span class="sched-time">${esc(s.time)}</span><span>${esc(s.item)}</span></div>`).join('')}
    </div>
    <div class="rule-block"><h3>娃醒得晚怎么办</h3><p>${esc(b.daily_schedule.alt_late_wake)}</p></div>
    <div class="rule-block"><h3>分菜的时机</h3><p>${esc(b.split_point_rule)}</p></div>
    <div class="rule-block"><h3>不能给的东西</h3><ul>${b.forbidden.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>
    <div class="rule-block"><h3>每周要点</h3><ul>${Object.values(b.nutrition_weekly).map(v => `<li>${esc(v)}</li>`).join('')}</ul></div>
  </div>`;
}

function render() {
  const app = document.getElementById('app');
  document.getElementById('week-label').textContent =
    week ? `${week.month}月 · ${new Date(week.generatedAt).getMonth()+1}/${new Date(week.generatedAt).getDate()} 生成` : `${month}月 · 菜谱 ${recipes.items.length} 道`;
  let html = '';
  if (view === 'menu') html = `<div class="menu-top">
      <button class="gen-btn" onclick="regen()">${week ? '重新排一周' : '生成本周菜单'}</button>
    </div>` + renderMenu();
  if (view === 'draw') html = renderDraw();
  if (view === 'shop') html = renderShop();
  if (view === 'season') html = renderSeason();
  if (view === 'baby') html = renderBaby();
  app.innerHTML = html;
  document.querySelectorAll('nav button').forEach(btn =>
    btn.classList.toggle('on', btn.dataset.view === view));
}
// 重排是破坏性的(整周换掉 + 购物清单勾选清空),但拦一道确认比直接给退路更烦人:
// 点了就排,把旧的一周连同采购勾选留着,顶上出现「撤销」。
// (注意:确认/提示都不能用 confirm()——嵌在 iframe 里会被沙箱拦掉,表现是「点了没反应」)
function regen() {
  if (week) { prevWeek = week; prevBought = bought; }
  week = generateWeek(); bought = {}; lastSwap = null; openBaby = {};
  store.set('week', week); store.set('bought', bought); store.set('openBaby', openBaby);
  store.set('prevWeek', prevWeek); store.set('prevBought', prevBought);
  render();
}
function undoRegen() {
  if (!prevWeek) return;
  week = prevWeek; bought = prevBought || {};
  prevWeek = null; prevBought = null;
  store.set('week', week); store.set('bought', bought);
  store.set('prevWeek', null); store.set('prevBought', null);
  render();
}
document.querySelectorAll('nav button').forEach(btn =>
  btn.addEventListener('click', () => { view = btn.dataset.view; render(); }));
render();
</script>
</body>
</html>
